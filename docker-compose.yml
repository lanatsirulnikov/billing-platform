services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billing_platform}
      POSTGRES_USER: ${POSTGRES_USER:-billing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_NAME: billing-platform-api
      APP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://billing_user:billing_password@db:5432/billing_platform}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: